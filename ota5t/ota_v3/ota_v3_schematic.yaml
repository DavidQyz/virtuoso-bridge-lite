# =============================================================================
# AUTHORITATIVE source for the OTA_V3 figure (RFC stage1 + class-AB stage2).
# Layout per user spec: input stage LEFT, stage-1 (folded-cascode) load MIDDLE,
# class-AB output stage RIGHT, load cap far right.
# Edit here -> tools/render_schematic.py -> svg/png.
# =============================================================================
meta:
  title: "OTA_V3 — RFC stage 1 + class-AB output stage"
  one_liner: "RFC first stage (FC-power, 2.3x Gm) -> Monticelli floating battery V_AB splits gn/gp -> push-pull MN_O/MP_O; Miller Cc+Rz; near-rail swing, SR decoupled from IQ."
  visible_internal_structure:
    - "stage1: tail M0, split input quad M1A/B,M2A/B, recycling mirrors MN1x/MN2x, cascode load M5-M10"
    - "stage2: MN_O/MP_O push-pull; V_AB floating battery (ideal Monticelli bias); Cc+Rz Miller comp"
  omitted_details: ["W/L sizes", "bulk pins (PMOS=VDD, NMOS=VSS)", "real translinear class-AB bias loop (modeled as ideal V_AB)"]
  conventions:
    pmos: "red; source=top"
    nmos: "blue; source=bottom"
    crossings: "crossings without dots are NOT connected"
  exports: {svg: ota5t/ota_v3/ota_v3_schematic.svg, png: ota5t/ota_v3/ota_v3_schematic.png}

canvas: {xlim: [0, 16.6], ylim: [0, 11.2], figsize: [16.8, 11.4], title_y: 11.0}

rails:
  - {net: VDD, y: 10.3, x0: 0.6, x1: 16.0}
  - {net: VSS, y: 0.8,  x0: 0.6, x1: 16.0}

devices:
  # ---- INPUT STAGE (left) ----
  - {name: M0,   kind: pmos, x: 3.9,  y: 9.2, gate: left,  label: right, role: "tail 2Ib (G=Vb_tail)"}
  - {name: M1A,  kind: pmos, x: 1.8,  y: 7.2, gate: right, label: left,  role: "input half (VIN+ -> nA)"}
  - {name: M1B,  kind: pmos, x: 3.0,  y: 7.2, gate: left,  label: right, role: "recycled half (VIN+ -> x2)"}
  - {name: M2B,  kind: pmos, x: 4.6,  y: 7.2, gate: right, label: right, role: "recycled half (VIN- -> x1)"}
  - {name: M2A,  kind: pmos, x: 6.0,  y: 7.2, gate: left,  label: right, role: "input half (VIN- -> nB)"}
  - {name: MN1A, kind: nmos, x: 1.2,  y: 2.6, gate: right, label: left,  role: "mirror out K units (-> nA)"}
  - {name: MN1B, kind: nmos, x: 2.6,  y: 2.6, gate: left,  label: left,  role: "mirror diode x1"}
  - {name: MN2B, kind: nmos, x: 5.0,  y: 2.6, gate: right, label: left,  role: "mirror diode x2"}
  - {name: MN2A, kind: nmos, x: 6.4,  y: 2.6, gate: left,  label: right, role: "mirror out K units (-> nB)"}
  # ---- STAGE-1 LOAD (middle): folded cascode stacks ----
  - {name: M9,   kind: pmos, x: 7.2,  y: 9.2, gate: left,  label: right, role: "mirror top (G=nA2)"}
  - {name: M10,  kind: pmos, x: 10.2, y: 9.2, gate: right, label: left,  role: "mirror top (G=nA2)"}
  - {name: M7,   kind: pmos, x: 7.2,  y: 7.6, gate: right, label: right, role: "P cascode (G=Vb_pc)"}
  - {name: M8,   kind: pmos, x: 10.2, y: 7.6, gate: right, label: left,  role: "P cascode -> gp"}
  - {name: M5,   kind: nmos, x: 7.2,  y: 5.4, gate: right, label: right, role: "N cascode (G=Vb_nc)"}
  - {name: M6,   kind: nmos, x: 10.2, y: 5.4, gate: right, label: left,  role: "N cascode -> gn"}
  # ---- CLASS-AB OUTPUT STAGE (right) ----
  - {name: MP_O, kind: pmos, x: 13.2, y: 8.0, gate: left,  label: right, role: "push (G=gp)"}
  - {name: MN_O, kind: nmos, x: 13.2, y: 4.6, gate: left,  label: right, role: "pull (G=gn)"}

blocks:
  - name: VAB
    x: 10.7
    y: 5.75
    w: 1.15
    h: 1.1
    title: "V_AB 0.7V\n(floating,\nMonticelli)"
    pins:
      - {name: P, side: left, frac: 0.79}
      - {name: N, side: left, frac: 0.32}
  - name: COMP
    x: 13.6
    y: 2.85
    w: 1.6
    h: 0.8
    title: "Cc 0.15p\n+ Rz 40k"
    pins:
      - {name: A, side: left,  frac: 0.5}
      - {name: B, side: right, frac: 0.5}
  - name: CL
    x: 15.1
    y: 5.95
    w: 0.95
    h: 0.7
    title: "CL\n50fF"
    pins:
      - {name: T, side: left, frac: 0.5}

rail_connections:
  VDD: [M0.top, M9.top, M10.top, MP_O.top]
  VSS: [MN1A.bot, MN1B.bot, MN2B.bot, MN2A.bot, MN_O.bot]

wires:
  # --- ntail bus ---
  - {net: ntail, path: [M0.bot, [3.9, 8.1]]}
  - {net: ntail, path: [[1.8, 8.1], [6.0, 8.1]]}
  - {net: ntail, path: [M1A.top, [1.8, 8.1]]}
  - {net: ntail, path: [M1B.top, [3.0, 8.1]]}
  - {net: ntail, path: [M2B.top, [4.6, 8.1]]}
  - {net: ntail, path: [M2A.top, [6.0, 8.1]]}
  # --- inputs (shared gates + port stubs) ---
  - {net: VINP, path: [M1A.gate, M1B.gate]}
  - {net: VINP, path: [[2.4, 7.2], [2.4, 6.85]]}
  - {net: VINN, path: [M2B.gate, M2A.gate]}
  - {net: VINN, path: [[5.3, 7.2], [5.3, 6.85]]}
  # --- recycling mirror gate ties ---
  - {net: x1, path: [MN1A.gate, MN1B.gate]}
  - {net: x2, path: [MN2B.gate, MN2A.gate]}
  # --- recycled drains -> diodes (cross-coupled) ---
  - {net: x1, path: [M2B.bot, [4.6, 4.05], [2.6, 4.05], MN1B.top]}
  - {net: x2, path: [M1B.bot, [3.0, 3.85], [5.0, 3.85], MN2B.top]}
  # --- fold nodes: nA (left stack), nB (right stack) ---
  - {net: nA, path: [MN1A.top, [1.2, 4.6], [7.2, 4.6], M5.bot]}
  - {net: nA, path: [M1A.bot, [1.8, 4.6]]}
  - {net: nB, path: [MN2A.top, [6.4, 4.3], [10.2, 4.3], M6.bot]}
  - {net: nB, path: [M2A.bot, [6.0, 4.3]]}
  # --- stack internals ---
  - {net: nA3, path: [M9.bot, M7.top]}
  - {net: nB3, path: [M10.bot, M8.top]}
  - {net: nA2, path: [M7.bot, M5.top]}
  # --- mirror-gate bus nA2 -> M9/M10 gates (top route) ---
  - {net: nA2, path: [[7.2, 6.4], [6.4, 6.4], [6.4, 10.0], [11.0, 10.0], [11.0, 9.2], M10.gate]}
  - {net: nA2, path: [[6.4, 9.2], M9.gate]}
  # --- gp: M8 drain -> V_AB.P -> MP_O gate ---
  - {net: gp, path: [M8.bot, [10.2, 6.62], [12.4, 6.62], [12.4, 8.0], MP_O.gate]}
  # --- gn: M6 drain -> V_AB.N -> MN_O gate (+ comp tap) ---
  - {net: gn, path: [M6.top, [10.2, 6.1], [12.0, 6.1], [12.0, 4.6], MN_O.gate]}
  - {net: gn, path: [[12.0, 4.6], [12.0, 3.25], [13.6, 3.25]]}
  # --- OUT: push-pull drains -> CL + comp return ---
  - {net: OUT, path: [MP_O.bot, MN_O.top]}
  - {net: OUT, path: [[13.2, 6.3], [15.1, 6.3]]}
  - {net: OUT, path: [[14.6, 6.3], [14.6, 6.85]]}
  - {net: OUT, path: [[15.2, 3.25], [15.85, 3.25], [15.85, 5.6], [14.6, 5.6], [14.6, 6.3]]}

dots: [[3.9, 8.1], [1.8, 8.1], [3.0, 8.1], [4.6, 8.1], [2.4, 7.2], [5.3, 7.2],
       [1.8, 4.6], [6.0, 4.3], [7.2, 6.4], [6.4, 9.2], [10.7, 6.62], [10.7, 6.1],
       [12.0, 4.6], [13.2, 6.3], [14.6, 6.3]]

bias_pins: []

ports:
  - {at: M0.gate,  name: "Vb_tail", kind: bias}
  - {at: M7.gate,  name: "Vb_pc", kind: bias}
  - {at: M8.gate,  name: "Vb_pc", kind: bias}
  - {at: M5.gate,  name: "Vb_nc", kind: bias}
  - {at: M6.gate,  name: "Vb_nc", kind: bias}
  - {xy: [2.4, 6.85],  name: "VIN+", kind: in}
  - {xy: [5.3, 6.85],  name: "VIN-", kind: in}
  - {xy: [14.6, 6.85], name: "OUT", kind: out}

notes:
  - "Stage 1 = OTA_V2's RFC scaled to FC power (~2.1uA): split input pair + cross-coupled 1:K recycling mirrors, Gm=(1+K)*gm_half."
  - "V_AB floating battery rides between cascode output taps gp (M8 drain) and gn (M6 drain): both output gates see the same signal, DC offset sets push-pull quiescent (class-AB)."
  - "Miller Cc+Rz from OUT back to gn. Slew: output devices overdrive far beyond IQ -> SR decoupled from static power; swing near rail-to-rail."
