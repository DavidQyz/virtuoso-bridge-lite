# =============================================================================
# AUTHORITATIVE SOURCE OF TRUTH for the folded-cascode OTA schematic figure.
# Pipeline: natural language -> THIS yaml -> render_schematic.py -> svg/png.
# To change the figure, EDIT THIS FILE and re-render. Never hand-edit the SVG,
# never re-derive the figure by "looking at" the PNG.
# =============================================================================
meta:
  title: Folded-cascode PMOS-input OTA
  one_liner: PMOS input pair folded into NMOS cascode, self-biased PMOS cascode mirror load.
  layout: "input stage (M0 tail + M1/M2 pair) on the FAR LEFT; the two cascode/load branches kept as two columns on the right (col-1 = M9/M7/M5/M3, col-2 = M10/M8/M6/M4)."
  visible_internal_structure:
    - 11 MOSFET symbols, labelled M0..M10
    - VDD / VSS power rails
    - signal wires with junction dots
    - ideal-bias gate pins (Vb_tail / Vb_pc / Vb_nc / Vb_n) and I/O ports (VIN+ / VIN- / OUT)
  omitted_details:
    - W/L sizes (kept in fc_ota.py, not on this figure)
    - bulk / substrate pins (PMOS bulk->VDD, NMOS bulk->VSS, drawn implicitly)
    - internal node net names (nA, nB, nA2, ntail... shown as wires only)
  conventions:
    pmos: "red symbol; SOURCE = top terminal (to VDD or tail)"
    nmos: "blue symbol; SOURCE = bottom terminal (to VSS)"
    gate: "side terminal; left/right per device"
    mirror_gate_bus: "nA2 routes UP BETWEEN the two columns to M9 & M10 gates (open lane)"
    m2_drain_route: "M2 drain wraps under the bottom and up to col-2 fold node nB; its one crossing of col-1 VSS stub is a NO-connect (no dot)"
    label_rule: "only device names Mx are drawn; no sizes; internal nets unlabelled"
  exports:
    svg: ota5t/fc_schematic.svg
    png: ota5t/fc_schematic.png
  figma:
    sync_status: "not synced (no Figma MCP here); local SVG is authoritative; import SVG into Figma"

canvas: {xlim: [0, 11.2], ylim: [0, 11], figsize: [12, 11], title_y: 10.85}

rails:
  - {net: VDD, y: 10.3, x0: 0.8, x1: 10.2}
  - {net: VSS, y: 0.8,  x0: 0.8, x1: 10.2}

# kind: pmos|nmos ; gate: left|right ; label: right|left.
# terminals derived: pmos -> top=source bot=drain ; nmos -> top=drain bot=source.
devices:
  # ---- input stage (far left) ----
  - {name: M0, kind: pmos, x: 2.7, y: 9.0, gate: left,  label: right, role: tail}
  - {name: M2, kind: pmos, x: 2.0, y: 6.8, gate: left,  label: left,  role: input- (outer, folds to far col-2)}
  - {name: M1, kind: pmos, x: 3.4, y: 6.8, gate: right, label: right, role: input+ (inner, folds to near col-1)}
  # ---- column 1 = left branch (reference) ----
  - {name: M9, kind: pmos, x: 6.0, y: 9.0, gate: right, label: left,  role: mirror-ref}
  - {name: M7, kind: pmos, x: 6.0, y: 7.5, gate: left,  label: right, role: pcascode-L}
  - {name: M5, kind: nmos, x: 6.0, y: 5.0, gate: left,  label: right, role: ncascode-L}
  - {name: M3, kind: nmos, x: 6.0, y: 3.0, gate: left,  label: right, role: sink-L}
  # ---- column 2 = right branch (output) ----
  - {name: M10, kind: pmos, x: 9.0, y: 9.0, gate: left,  label: right, role: mirror-out}
  - {name: M8,  kind: pmos, x: 9.0, y: 7.5, gate: right, label: left,  role: pcascode-R}
  - {name: M6,  kind: nmos, x: 9.0, y: 5.0, gate: right, label: left,  role: ncascode-R}
  - {name: M4,  kind: nmos, x: 9.0, y: 3.0, gate: right, label: left,  role: sink-R}

rail_connections:
  VDD: [M0.top, M9.top, M10.top]
  VSS: [M3.bot, M4.bot]

# path points: "Dev.term" (resolved) or [x, y] waypoint.
wires:
  - {net: ntail, path: [M2.top, [2.0, 7.7], [3.4, 7.7], M1.top]}
  - {net: ntail, path: [M0.bot, [2.7, 7.7]]}
  - {net: nA3,   path: [M9.bot, M7.top]}
  - {net: nA2,   path: [M7.bot, M5.top]}
  - {net: nA,    path: [M5.bot, M3.top]}
  - {net: nB3,   path: [M10.bot, M8.top]}
  - {net: OUT,   path: [M8.bot, M6.top]}
  - {net: nB,    path: [M6.bot, M4.top]}
  - {net: nA,    path: [M1.bot, [3.4, 4.0], [6.0, 4.0]]}                          # M1 (inner) drain -> col-1 fold node nA
  - {net: nB,    path: [M2.bot, [2.0, 2.0], [8.4, 2.0], [8.4, 4.0], [9.0, 4.0]]}  # M2 (outer) drain wraps under to col-2 fold node nB
  - {net: mir,   path: [[6.0, 6.2], [6.8, 6.2], [6.8, 9.0], M10.gate]}         # nA2 bus up between columns -> M10 gate
  - {net: mir,   path: [[6.8, 9.0], M9.gate]}                                  # -> M9 gate
  - {net: OUT,   path: [[9.0, 6.2], [10.0, 6.2]]}

dots: [[2.7, 7.7], [6.0, 4.0], [9.0, 4.0], [6.0, 6.2], [6.8, 9.0], [9.0, 6.2]]

bias_pins:
  - {at: M0.gate, name: Vb_tail, side: left}
  - {at: M7.gate, name: Vb_pc,   side: left}
  - {at: M8.gate, name: Vb_pc,   side: right}
  - {at: M5.gate, name: Vb_nc,   side: left}
  - {at: M6.gate, name: Vb_nc,   side: right}
  - {at: M3.gate, name: Vb_n,    side: left}
  - {at: M4.gate, name: Vb_n,    side: right}

ports:
  - {at: M1.gate, name: "VIN+", kind: in}
  - {at: M2.gate, name: "VIN-", kind: in}
  - {xy: [10.0, 6.2], name: OUT, kind: out}

notes:
  - "Col-1 (M9-M7-M5-M3) is the reference branch; col-2 (M10-M8-M6-M4) is the output branch."
  - "OUT = M8 drain = M6 drain (single-ended high-impedance node)."
  - "Input drains fold to the NMOS fold nodes: M1->nA (col-1), M2->nB (col-2)."
