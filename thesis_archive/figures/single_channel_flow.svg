<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="'Segoe UI', Arial, sans-serif">
  <!-- ============ defs ============ -->
  <defs>
    <marker id="aG" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#27AE60"/></marker>
    <marker id="aGs" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#27AE60"/></marker>
    <marker id="aB" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2D7DD2"/></marker>
    <marker id="aM" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#B83DB5"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#15324a" flood-opacity="0.20"/>
    </filter>
    <style>
      .box  { rx:11; ry:11; stroke-width:2.5; }
      .en   { fill:#E9F9EF; stroke:#27AE60; }
      .ctl  { fill:#E8F1FC; stroke:#2D7DD2; }
      .idle { fill:#F8EAF6; stroke:#B83DB5; }
      .t    { fill:#1a2a36; font-weight:700; text-anchor:middle; }
      .t14 { font-size:14px; } .t13 { font-size:13px; }
      .sub  { fill:#566b7a; font-size:11px; font-weight:600; text-anchor:middle; }
      .lbl  { font-weight:700; font-size:12px; }
      .lG{fill:#1e8449;} .lB{fill:#21618c;} .lM{fill:#8e2d86;}
      .note { fill:#5b6b7a; font-size:11px; font-weight:600; }
      .wire { fill:none; stroke-width:2.4; }
      .wG{stroke:#27AE60;} .wB{stroke:#2D7DD2;} .wM{stroke:#B83DB5; stroke-dasharray:6 4;}
      .spine{stroke-width:3.2;}
    </style>
  </defs>

  <rect x="0" y="0" width="1300" height="700" fill="#ffffff"/>

  <!-- title + legend -->
  <text x="660" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#34495e">Single-Channel: Adaptive Regulating Rectifier + Current Stimulator</text>
  <g transform="translate(440,64)">
    <circle cx="0" cy="0" r="7" fill="none" stroke="#27AE60" stroke-width="3"/>
    <text x="14" y="5" class="lbl lG">Power Path</text>
    <circle cx="150" cy="0" r="7" fill="none" stroke="#2D7DD2" stroke-width="3"/>
    <text x="164" y="5" class="lbl lB">Control Path</text>
    <circle cx="320" cy="0" r="7" fill="none" stroke="#B83DB5" stroke-width="3"/>
    <text x="334" y="5" class="lbl lM">Enable / Idle</text>
  </g>

  <!-- ============ WIRES ============ -->
  <!-- energy spine -->
  <path class="wire wG spine" d="M680,152 L680,270" marker-end="url(#aG)"/>                 <!-- SIN->Rect -->
  <path class="wire wG spine" d="M750,302 L860,302" marker-end="url(#aG)"/>                 <!-- Rect->Hbridge (Mp_out) -->
  <path class="wire wG spine" d="M930,334 L930,360 L1180,360 L1180,380" marker-end="url(#aG)"/> <!-- Hbridge->V_headroom->IDAC -->
  <!-- OUTCAP taps the middle of the Mp_out node (no arrow: passive cap) -->
  <path class="wire wG" d="M805,302 L805,390"/>
  <!-- energy: SIN sense -> comparator -->
  <path class="wire wG" d="M620,126 L80,126 L80,318 L110,318" marker-end="url(#aG)"/>
  <!-- V_headroom bus taps -->
  <path class="wire wG" d="M930,517 L810,517" marker-end="url(#aG)"/>                        <!-- -> Idle -->
  <path class="wire wG" d="M930,360 L930,615 L430,615 L430,500" marker-end="url(#aG)"/>      <!-- V_fb -> PI -->

  <!-- IDAC -> current source -> VSS -->
  <path class="wire wG spine" d="M1180,440 L1180,453"/>
  <circle cx="1180" cy="468" r="15" fill="#ffffff" stroke="#27AE60" stroke-width="2.5"/>
  <path d="M1180,459 L1180,477" stroke="#27AE60" stroke-width="2.2" fill="none" marker-end="url(#aGs)"/>
  <path class="wire wG spine" d="M1180,483 L1180,500" marker-end="url(#aG)"/>

  <!-- control -->
  <path class="wire wB" d="M30,290 L110,290" marker-end="url(#aB)"/>                          <!-- Mp_out -> Comp -->
  <path class="wire wB" d="M250,302 L300,302" marker-end="url(#aB)"/>
  <path class="wire wB" d="M180,270 L180,225 L510,225 L510,270" marker-end="url(#aB)"/>      <!-- Comp -> NAND (V_IN) -->
  <path class="wire wB" d="M410,302 L460,302" marker-end="url(#aB)"/>
  <path class="wire wB" d="M560,302 L610,302" marker-end="url(#aB)"/>
  <path class="wire wB" d="M355,438 L355,334" marker-end="url(#aB)"/>                          <!-- PI -> VCDL (Vc) -->
  <path class="wire wB" d="M1292,408 L1238,408" marker-end="url(#aB)"/>                        <!-- code<4:0> -> IDAC -->

  <!-- enable / idle: one line leftward from Idle to PI and Comparator -->
  <path class="wire wM" d="M630,517 L160,517 L160,334" marker-end="url(#aM)"/>
  <path class="wire wM" d="M360,517 L360,500" marker-end="url(#aM)"/>

  <!-- ============ edge labels ============ -->
  <text x="35"   y="281" class="lbl lB" text-anchor="start">Mp_out</text>
  <text x="758"  y="294" class="lbl lG" text-anchor="start">Mp_out</text>
  <text x="585"  y="324" class="lbl lB">Control pulse</text>
  <text x="368"  y="395" class="lbl lB" text-anchor="start">Vc</text>
  <text x="940"  y="466" class="lbl lG" text-anchor="start">V_headroom</text>
  <text x="940"  y="482" class="lG" text-anchor="start" font-size="11" font-weight="700">→ 75 mV</text>
  <text x="445"  y="610" class="lbl lG" text-anchor="start">V_fb</text>
  <text x="138"  y="430" class="lbl lM" text-anchor="end">EN</text>
  <text x="470"  y="512" class="lbl lM" text-anchor="start">EN</text>
  <text x="1265" y="399" class="lbl lB" text-anchor="middle">code&lt;4:0&gt;</text>
  <text x="1202" y="463" class="lbl lG" text-anchor="start">I_stim</text>
  <text x="1202" y="479" class="lG" text-anchor="start" font-size="11" font-weight="700">0–155 µA</text>

  <!-- ============ BOXES (shadowed) ============ -->
  <g filter="url(#sh)">
    <rect class="box en"   x="620"  y="100" width="120" height="52"/>
    <rect class="box ctl"  x="110"  y="270" width="140" height="64"/>
    <rect class="box ctl"  x="300"  y="270" width="110" height="64"/>
    <rect class="box ctl"  x="460"  y="270" width="100" height="64"/>
    <rect class="box en"   x="610"  y="270" width="140" height="64"/>
    <rect class="box en"   x="860"  y="270" width="140" height="64"/>
    <rect class="box en"   x="755"  y="390" width="100" height="58"/>
    <rect class="box ctl"  x="295"  y="438" width="170" height="62"/>
    <rect class="box idle" x="630"  y="485" width="180" height="64"/>
    <rect class="box en"   x="1125" y="380" width="110" height="60"/>
    <rect class="box en"   x="1125" y="500" width="110" height="52"/>
  </g>

  <!-- ============ BOX LABELS ============ -->
  <text class="t t14" x="680"  y="122">SIN_p</text>
  <text class="sub"   x="680"  y="140">13.56 MHz</text>
  <text class="t t14" x="180"  y="307">Comparator</text>
  <text class="t t14" x="355"  y="307">VCDL</text>
  <text class="t t14" x="510"  y="307">NAND</text>
  <text class="t t13" x="680"  y="307">Rect_switch</text>
  <text class="t t14" x="930"  y="307">H-bridge</text>
  <text class="t t14" x="805"  y="414">OUTCAP</text>
  <text class="sub"   x="805"  y="432">80 pF</text>
  <text class="t t13" x="380"  y="474">PI_controller</text>
  <text class="t t13" x="720"  y="522">Idle controller</text>
  <text class="t t14" x="1180" y="406">IDAC</text>
  <text class="sub"   x="1180" y="424">5-bit</text>
  <text class="t t14" x="1180" y="530">VSS</text>
</svg>
